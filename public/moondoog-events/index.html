<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <title>Moondoog Events</title>
  <style>
    :root {
      --ink: #0e1013;
      --brass: #e8b657;
      --cord: #c8302c;
      --bone: #f5f1e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--bone);
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }
    .stage {
      width: min(100vw, 480px);
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(232, 182, 87, 0.28), rgba(232, 182, 87, 0) 42%),
        #0e1013;
    }
    .sky, .poster, .video, .controls {
      position: absolute;
      inset: 0;
    }
    .moon {
      position: absolute;
      top: 12%;
      left: 50%;
      width: 42vw;
      max-width: 180px;
      aspect-ratio: 1;
      margin-left: -21vw;
      border-radius: 50%;
      background: #f3e2b0;
      box-shadow: 0 0 40px rgba(232, 182, 87, 0.45);
      animation: rise 6s ease-in-out infinite;
    }
    .dog {
      position: absolute;
      left: 50%;
      bottom: 28%;
      width: 120px;
      height: 90px;
      margin-left: -60px;
      background: #191d23;
      border-radius: 60px 60px 40px 40px;
      animation: bob 1.6s ease-in-out infinite;
    }
    .dog:before, .dog:after {
      content: "";
      position: absolute;
      top: -28px;
      width: 36px;
      height: 46px;
      background: #191d23;
      border-radius: 40px 40px 8px 8px;
    }
    .dog:before { left: 12px; transform: rotate(-18deg); }
    .dog:after { right: 12px; transform: rotate(18deg); }
    .poster {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
      text-align: center;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 10vw, 3.4rem);
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 22px; color: #dadde2; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 16px 22px;
      font: inherit;
      font-size: 1.15rem;
      cursor: pointer;
    }
    .view {
      background: var(--cord);
      color: white;
      width: 100%;
    }
    .controls {
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      padding: 18px;
      background: linear-gradient(rgba(14, 16, 19, 0), rgba(14, 16, 19, 0.72));
      pointer-events: none;
    }
    .controls button {
      pointer-events: auto;
      background: var(--brass);
      color: #191d23;
    }
    .playing .poster {
      transform: translateY(110%);
      opacity: 0;
      pointer-events: none;
    }
    .playing .controls { display: flex; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: black;
    }
    @keyframes rise {
      50% { transform: translateY(-12px); }
    }
    @keyframes bob {
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="sky" aria-hidden="true"><div class="moon"></div><div class="dog"></div></div>
    <section class="poster">
      <h1>Moondoog Events</h1>
      <p>Tonight only. Sound starts when you tap.</p>
      <button class="view" id="view" type="button">View events</button>
    </section>
    <div class="video" id="video" hidden></div>
    <div class="controls">
      <button id="replay" type="button">Replay</button>
      <button id="mute" type="button" aria-pressed="false">Mute</button>
    </div>
  </main>
  <script>
    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const muteButton = document.getElementById("mute");
    const clip = "dQw4w9WgXcQ";
    let frame = null;
    let muted = false;

    function src() {
      const origin = encodeURIComponent(location.origin);
      return "https://www.youtube-nocookie.com/embed/" + clip
        + "?autoplay=1&playsinline=1&rel=0&enablejsapi=1&mute=" + (muted ? "1" : "0")
        + "&origin=" + origin;
    }

    function mount() {
      video.hidden = false;
      video.replaceChildren();
      frame = document.createElement("iframe");
      frame.title = "Moondoog event";
      frame.allow = "autoplay; encrypted-media; picture-in-picture";
      frame.setAttribute("allowfullscreen", "");
      frame.src = src();
      video.appendChild(frame);
      stage.classList.add("playing");
    }

    function command(func, args) {
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.postMessage(JSON.stringify({
        event: "command",
        func: func,
        args: args || []
      }), "*");
    }

    document.getElementById("view").addEventListener("click", mount);
    document.getElementById("replay").addEventListener("click", function () {
      command("seekTo", [0, true]);
      command("playVideo");
    });
    muteButton.addEventListener("click", function () {
      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";
      muteButton.setAttribute("aria-pressed", String(muted));
      command(muted ? "mute" : "unMute");
    });
  </script>
</body>
</html>
